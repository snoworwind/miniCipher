name: Release

on:
  push:
    tags:
      - 'v*'  # Match tags starting with v, e.g., v1.0.0, v2.1.0-beta.1
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-all-platforms:
    strategy:
      matrix:
        include:
          # Windows configuration
          - os: windows-latest
            platform: windows
            architecture: x64
            output_name: Cipher-windows-x64.exe
            asset_name: cipher-windows-x64.exe
          # macOS configuration (Intel)
          - os: macos-latest
            platform: macos
            architecture: x64
            output_name: Cipher-macos-x64
            asset_name: cipher-macos-x64
          # macOS configuration (Apple Silicon)
          - os: macos-latest
            platform: macos
            architecture: arm64
            output_name: Cipher-macos-arm64
            asset_name: cipher-macos-arm64
          # Linux configuration
          - os: ubuntu-latest
            platform: linux
            architecture: x64
            output_name: Cipher-linux-x64
            asset_name: cipher-linux-x64

    env:
      PYTHONIOENCODING: utf-8

    runs-on: ${{ matrix.os }}
    name: Build for ${{ matrix.platform }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Get full history for git describe

    - name: Get version from tag
      id: get_version
      shell: bash
      run: |
        # Get version from git tag
        if [ -n "${{ github.ref_name }}" ]; then
          VERSION="${{ github.ref_name }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=$VERSION" >> $GITHUB_OUTPUT
          
          # Clean version for filenames
          CLEAN_VERSION=$(echo "$VERSION" | sed 's/^v//' | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "CLEAN_VERSION=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          
          echo "Building version: $VERSION"
          echo "Clean version for files: $CLEAN_VERSION"
        else
          echo "ERROR: No tag found!"
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-


    - name: Generate version information
      shell: bash
      run: |
        # Use version.py script to generate version information for release
        python version.py --type release --platform ${{ matrix.platform }} --architecture ${{ matrix.architecture }}
        
        # Extract version from version.txt
        VERSION=$(grep '^version:' version.txt | cut -d' ' -f2)
        BUILD_DATE=$(grep '^build_date:' version.txt | cut -d' ' -f2)
        COMMIT_HASH=$(grep '^commit_hash:' version.txt | cut -d' ' -f2)
        COMMIT_COUNT=$(grep '^commit_count:' version.txt | cut -d' ' -f2)
        
        echo "=== VERSION INFORMATION ==="
        echo "Version: $VERSION"
        echo "Build date: $BUILD_DATE"
        echo "Commit hash: $COMMIT_HASH"
        echo "Commit count: $COMMIT_COUNT"
        echo "Platform: ${{ matrix.platform }}-${{ matrix.architecture }}"
        echo "=========================="
        
        # Create build information file using actual version information
        cat > build-info-${{ matrix.platform }}.txt << EOF
        MiniCipher Build Information
        ============================
        Version: $VERSION
        Platform: ${{ matrix.platform }}-${{ matrix.architecture }}
        Build date: $BUILD_DATE
        Commit: $(git rev-parse HEAD)
        Commit short: $COMMIT_HASH
        Python version: $(python --version)
        Build runner: ${{ matrix.os }}
        
        SHA256 Checksums:
        -----------------
        EOF

    - name: Install system dependencies
      shell: bash
      run: |
        echo "Installing system dependencies for ${{ matrix.platform }}..."
        
        case "${{ matrix.platform }}" in
          macos)
            echo "Installing tkinter for macOS..."
            # Check if tkinter is already available
            python -c "import tkinter" 2>/dev/null || brew install python-tk || echo "Warning: tkinter installation may have failed, continuing..."
            ;;
          linux)
            echo "Installing tkinter for Linux..."
            sudo apt-get update
            sudo apt-get install -y python3-tk || echo "Warning: tkinter installation may have failed, continuing..."
            ;;
          windows)
            echo "Windows: tkinter is typically included with Python installation"
            ;;
        esac
        
        echo "System dependencies installation completed."

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python build.py --install-deps --system-python

    - name: Build executable
      shell: bash
      run: |
        echo "Building ${{ matrix.platform }} version..."
        python build.py --clean --build --system-python
        
        # Verify build based on platform
        echo "Verifying build for ${{ matrix.platform }}..."
        case "${{ matrix.platform }}" in
          windows)
            if [ ! -f "dist/Cipher.exe" ]; then
              echo "ERROR: Cipher.exe not found!"
              ls -la dist/ || true
              exit 1
            fi
            echo "Build successful: dist/Cipher.exe"
            ;;
          macos|linux)
            if [ ! -f "dist/Cipher" ]; then
              echo "ERROR: Cipher not found!"
              ls -la dist/ || true
              exit 1
            fi
            echo "Build successful: dist/Cipher"
            ;;
        esac

    - name: Test build
      run: |
        echo "Testing build..."
        python build.py --test --system-python

    - name: Prepare release assets
      shell: bash
      run: |
        echo "Preparing release assets for ${{ matrix.platform }}..."
        
        # Copy executable based on platform
        case "${{ matrix.platform }}" in
          windows)
            echo "Copying Windows executable..."
            cp dist/Cipher.exe dist/${{ matrix.output_name }}
            ;;
          macos|linux)
            echo "Copying macOS/Linux executable..."
            cp dist/Cipher dist/${{ matrix.output_name }}
            ;;
        esac
        
        RELEASE_FILE="dist/${{ matrix.output_name }}"
        
        # Calculate SHA256
        if command -v sha256sum > /dev/null 2>&1; then
          SHA256=$(sha256sum "$RELEASE_FILE" | cut -d' ' -f1)
        elif command -v shasum > /dev/null 2>&1; then
          SHA256=$(shasum -a 256 "$RELEASE_FILE" | cut -d' ' -f1)
        else
          SHA256="unknown"
        fi
        
        echo "SHA256: $SHA256"
        echo "File: $RELEASE_FILE"
        
        # Update build information file
        echo "${{ matrix.output_name }}: $SHA256" >> build-info-${{ matrix.platform }}.txt
        
        # Create platform-specific installation instructions
        case "${{ matrix.platform }}" in
          windows)
            INSTALL_INSTRUCTIONS="Windows: Double-click ${{ matrix.output_name }} or run from command line"
            ;;
          macos)
            INSTALL_INSTRUCTIONS="macOS: Right-click ${{ matrix.output_name }} and select 'Open', or run './${{ matrix.output_name }}' from terminal"
            ;;
          linux)
            INSTALL_INSTRUCTIONS="Linux: Make executable with 'chmod +x ${{ matrix.output_name }}' then run './${{ matrix.output_name }}'"
            ;;
        esac
        
        # Create final version information file
        cat > release-${{ matrix.platform }}.txt << EOF
        MiniCipher Release
        ==================
        Version: ${{ steps.get_version.outputs.VERSION }}
        File: ${{ matrix.output_name }}
        Platform: ${{ matrix.platform }}-${{ matrix.architecture }}
        SHA256: $SHA256
        Build date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
        
        Installation:
        -------------
        $INSTALL_INSTRUCTIONS
        
        Source code: https://github.com/${{ github.repository }}
        EOF
        
        # Show final file list
        echo "Release assets ready:"
        ls -la dist/
        echo ""
        echo "Info files:"
        ls -la *.txt

    - name: Upload artifacts for release
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.platform }}-${{ steps.get_version.outputs.CLEAN_VERSION }}
        path: |
          dist/${{ matrix.output_name }}
          build-info-${{ matrix.platform }}.txt
          release-${{ matrix.platform }}.txt
        retention-days: 7

  create-release:
    runs-on: ubuntu-latest
    needs: build-all-platforms
    name: Create GitHub Release
    if: success()

    env:
      PYTHONIOENCODING: utf-8

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: Debug downloaded artifacts
      shell: bash
      run: |
        echo "Artifacts directory structure:"
        find release-artifacts -type f -name "*" | sort
        echo ""
        echo "Files that match *.exe pattern:"
        find release-artifacts -type f -name "*.exe" | sort
        echo ""
        echo "Files that match Cipher-* pattern:"
        find release-artifacts -type f -name "Cipher-*" | sort
        echo ""
        echo "Files that match *.txt pattern:"
        find release-artifacts -type f -name "*.txt" | sort
        echo ""
        echo "Full tree structure:"
        tree release-artifacts || ls -laR release-artifacts

    - name: Generate release notes
      shell: bash
      run: |
        echo "Generating release notes..."
        
        # Get latest commit information
        LATEST_TAG="${{ github.ref_name }}"
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 "$LATEST_TAG^" 2>/dev/null || echo "")
        
        echo "# MiniCipher $LATEST_TAG" > release-notes.md
        echo "" >> release-notes.md
        echo "## Downloads" >> release-notes.md
        echo "" >> release-notes.md
        echo "Platform | File | SHA256" >> release-notes.md
        echo "-------- | ---- | ------" >> release-notes.md
        
        # Extract information from build information files
        for info_file in release-artifacts/**/build-info-*.txt; do
          if [ -f "$info_file" ]; then
            PLATFORM=$(basename "$info_file" | sed 's/build-info-//' | sed 's/.txt//')
            SHA256_LINE=$(grep "SHA256 Checksums" -A 10 "$info_file" | tail -1)
            FILENAME=$(echo "$SHA256_LINE" | cut -d: -f1 | xargs)
            HASH=$(echo "$SHA256_LINE" | cut -d: -f2 | xargs)
            
            if [ -n "$FILENAME" ] && [ -n "$HASH" ]; then
              echo "$PLATFORM | [$FILENAME](https://github.com/${{ github.repository }}/releases/download/$LATEST_TAG/$FILENAME) | \`$HASH\`" >> release-notes.md
            fi
          fi
        done
        
        echo "" >> release-notes.md
        echo "## Installation" >> release-notes.md
        echo "" >> release-notes.md
        echo "### Windows" >> release-notes.md
        echo "1. Download `cipher-windows-x64.exe`" >> release-notes.md
        echo "2. Double-click to run" >> release-notes.md
        echo "" >> release-notes.md
        echo "### macOS (Intel)" >> release-notes.md
        echo "1. Download `cipher-macos-x64`" >> release-notes.md
        echo "2. Right-click the file and select 'Open', or run `./cipher-macos-x64` from terminal" >> release-notes.md
        echo "" >> release-notes.md
        echo "### macOS (Apple Silicon)" >> release-notes.md
        echo "1. Download `cipher-macos-arm64`" >> release-notes.md
        echo "2. Right-click the file and select 'Open', or run `./cipher-macos-arm64` from terminal" >> release-notes.md
        echo "" >> release-notes.md
        echo "### Linux" >> release-notes.md
        echo "1. Download `cipher-linux-x64`" >> release-notes.md
        echo "2. Make executable: `chmod +x cipher-linux-x64`" >> release-notes.md
        echo "3. Run: `./cipher-linux-x64`" >> release-notes.md
        echo "" >> release-notes.md
        
        if [ -n "$PREVIOUS_TAG" ]; then
          echo "## Changes since $PREVIOUS_TAG" >> release-notes.md
          echo "" >> release-notes.md
          echo '```' >> release-notes.md
          git log --oneline --no-decorate "$PREVIOUS_TAG..$LATEST_TAG" >> release-notes.md
          echo '```' >> release-notes.md
        else
          echo "## Initial Release" >> release-notes.md
        fi
        
        echo "" >> release-notes.md
        echo "## Build Information" >> release-notes.md
        echo "" >> release-notes.md
        echo "- Build date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> release-notes.md
        echo "- Commit: $(git rev-parse --short HEAD)" >> release-notes.md
        echo "- Python: 3.11" >> release-notes.md
        
        echo "Release notes generated:"
        cat release-notes.md

    - name: Debug permissions and tag info
      shell: bash
      run: |
        echo "=== Debug Information ==="
        echo "Tag: ${{ github.ref_name }}"
        echo "Repository: ${{ github.repository }}"
        echo "Workflow run ID: ${{ github.run_id }}"
        echo "Commit SHA: ${{ github.sha }}"
        echo "========================"
        
        # Test GitHub API permissions
        echo "Testing GitHub API permissions..."
        API_RESPONSE=$(curl -s -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          "https://api.github.com/repos/${{ github.repository }}" || echo "API call failed")
        
        HTTP_CODE=$(echo "$API_RESPONSE" | tail -1)
        API_CONTENT=$(echo "$API_RESPONSE" | head -n -1)
        
        echo "GitHub API response code: $HTTP_CODE"
        if [ "$HTTP_CODE" = "200" ]; then
          echo "✓ GitHub API access successful"
          # Try to get repository permissions
          PERMISSIONS=$(echo "$API_CONTENT" | grep -o '"permissions":[^}]*' || echo "No permissions info")
          echo "Repository permissions: $PERMISSIONS"
        else
          echo "⚠️  GitHub API access failed with code: $HTTP_CODE"
          echo "Response content:"
          echo "$API_CONTENT" | head -10
        fi
        
        # Check if tag already has a release
        echo ""
        echo "Checking if tag has existing release..."
        TAG="${{ github.ref_name }}"
        if [ -n "$TAG" ]; then
          echo "Checking GitHub API for tag $TAG..."
          # Try to get release info for this tag
          RELEASE_RESPONSE=$(curl -s -w "%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG" || echo "API call failed")
          
          RELEASE_HTTP_CODE=$(echo "$RELEASE_RESPONSE" | tail -1)
          RELEASE_CONTENT=$(echo "$RELEASE_RESPONSE" | head -n -1)
          
          echo "Release API response code: $RELEASE_HTTP_CODE"
          if [ "$RELEASE_HTTP_CODE" = "404" ]; then
            echo "✓ Tag $TAG does not have an existing release"
          elif [ "$RELEASE_HTTP_CODE" = "200" ]; then
            echo "⚠️  Tag $TAG already has a release!"
            echo "Release info:"
            echo "$RELEASE_CONTENT" | head -5
            echo "You may need to delete the existing release or use a new tag."
          else
            echo "⚠️  Release API returned unexpected code: $RELEASE_HTTP_CODE"
            echo "Response content:"
            echo "$RELEASE_CONTENT" | head -10
          fi
        fi
        
        # Check workflow permissions
        echo ""
        echo "=== Workflow Permission Recommendations ==="
        echo "If you see 403 errors, check your repository settings:"
        echo "1. Go to Settings → Actions → General"
        echo "2. Under 'Workflow permissions', select 'Read and write permissions'"
        echo "3. Make sure 'Allow GitHub Actions to create and approve pull requests' is enabled"
        echo "==========================================="

    - name: Create Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        name: MiniCipher ${{ github.ref_name }}
        body_path: release-notes.md
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}  # Mark as prerelease if tag contains '-'
        files: |
          release-artifacts/**/*.exe
          release-artifacts/**/*.txt

  notify:
    runs-on: ubuntu-latest
    needs: create-release
    name: Release Notification
    if: always()

    steps:
    - name: Release status
      run: |
        echo "============================="
        echo "   RELEASE COMPLETED"
        echo "============================="
        echo ""
        echo "Version: ${{ github.ref_name }}"
        echo "Status: ${{ job.status }}"
        echo ""
        echo "Release URL:"
        echo "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        echo ""
        echo "============================="