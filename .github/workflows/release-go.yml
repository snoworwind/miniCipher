name: Release (Go)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Go Test & Vet (Release)

    defaults:
      run:
        working-directory: go-migrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go-migrate/go.sum

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1

  build-all-platforms:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
            output: minicipher-linux-amd64
            asset_name: minicipher-linux-amd64
          - os: macos-latest
            goarch: arm64
            output: minicipher-macos-arm64
            asset_name: minicipher-macos-arm64
            dmg_name: MiniCipher-macOS-arm64.dmg
          - os: windows-latest
            goarch: amd64
            output: minicipher-windows-amd64.exe
            asset_name: minicipher-windows-amd64.exe

    runs-on: ${{ matrix.os }}
    name: Build Go ${{ matrix.os }}-${{ matrix.goarch }}

    defaults:
      run:
        shell: bash
        working-directory: go-migrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go-migrate/go.sum

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Download dependencies
        run: go mod download

      - name: Setup MinGW (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH

      - name: Build
        env:
          GOOS: ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'darwin' || 'linux' }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          WFLAGS="-s -w"
          if [ "$GOOS" = "windows" ]; then
            WFLAGS="$WFLAGS -H windowsgui"
          fi
          go build -trimpath -o dist/${{ matrix.output }} -ldflags "$WFLAGS" ./cmd/minicipher/

      - name: Wrap macOS .app bundle
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p "dist/MiniCipher.app/Contents/MacOS"
          mv "dist/${{ matrix.output }}" "dist/MiniCipher.app/Contents/MacOS/MiniCipher"
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0">'
            echo '<dict>'
            echo '    <key>CFBundleExecutable</key>'
            echo '    <string>MiniCipher</string>'
            echo '    <key>CFBundleIdentifier</key>'
            echo '    <string>com.snoworwind.minicipher</string>'
            echo '    <key>CFBundleName</key>'
            echo '    <string>miniCipher</string>'
            echo '    <key>CFBundleVersion</key>'
            echo '    <string>2.1.0</string>'
            echo '    <key>CFBundleShortVersionString</key>'
            echo '    <string>2.1.0</string>'
            echo '    <key>LSMinimumSystemVersion</key>'
            echo '    <string>10.14</string>'
            echo '    <key>NSHighResolutionCapable</key>'
            echo '    <true/>'
            echo '</dict>'
            echo '</plist>'
          } > "dist/MiniCipher.app/Contents/Info.plist"
          echo "✅ macOS .app bundle created"

      - name: Ad-hoc sign macOS .app
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          codesign --force --deep --sign - "dist/MiniCipher.app"
          echo "✅ macOS .app ad-hoc signed"

      - name: Create macOS DMG
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          hdiutil create -volname "MiniCipher" \
            -srcfolder "dist/MiniCipher.app" \
            -ov -format UDZO \
            "dist/${{ matrix.dmg_name }}"
          echo "✅ macOS DMG created at dist/${{ matrix.dmg_name }}"

      - name: Verify build
        run: ls -lh dist/

      - name: Upload artifact (macOS DMG)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: go-migrate/dist/${{ matrix.dmg_name }}

      - name: Upload artifact (Linux/Windows binary)
        if: matrix.os != 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: go-migrate/dist/${{ matrix.output }}

  release:
    runs-on: ubuntu-latest
    needs: build-all-platforms
    name: Create GitHub Release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Display release assets
        run: |
          echo "Release assets:"
          find release-assets -type f -exec ls -lh {} \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: miniCipher ${{ github.ref_name }}
          body: |
            ## miniCipher ${{ github.ref_name }}

            Go 实现的 miniCipher 加密工具，基于 Fyne GUI 框架。

            ### 下载说明

            | 平台 | 文件 |
            |------|------|
            | Linux (amd64) | `minicipher-linux-amd64` |
            | macOS (Apple Silicon) | `MiniCipher-macOS-arm64.dmg` |
            | Windows (amd64) | `minicipher-windows-amd64.exe` |

            ### 功能

            - OTP / AES256-GCM 加密
            - 随机密钥 / 密码模式
            - 批量加密/解密（支持多线程）
            - 中英文界面
            - 深色/浅色主题

            ### 使用方式

            ```bash
            # Linux
            chmod +x minicipher-linux-amd64
            ./minicipher-linux-amd64

            # macOS
            双击 .dmg 挂载，将 MiniCipher.app 拖入 Applications 文件夹
            如提示"已损坏"，终端执行: xattr -cr /Applications/MiniCipher.app

            # Windows
            .\minicipher-windows-amd64.exe
            ```

            ---
            > 🤖 本项目完全由 AI 开发。
          files: |
            release-assets/**/minicipher-linux-amd64
            release-assets/**/MiniCipher*.dmg
            release-assets/**/minicipher-windows-amd64.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}