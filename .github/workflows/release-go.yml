name: Release (Go)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-all-platforms:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
            output: minicipher-linux-amd64
            asset_name: minicipher-linux-amd64
          - os: macos-latest
            goarch: arm64
            output: minicipher-macos-arm64
            asset_name: minicipher-macos-arm64
          - os: windows-latest
            goarch: amd64
            output: minicipher-windows-amd64.exe
            asset_name: minicipher-windows-amd64.exe

    runs-on: ${{ matrix.os }}
    name: Build Go ${{ matrix.os }}-${{ matrix.goarch }}

    defaults:
      run:
        shell: bash
        working-directory: go-migrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: go-migrate/go.sum

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Download dependencies
        run: go mod download

      - name: Build
        env:
          GOOS: ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'darwin' || 'linux' }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          WFLAGS="-s -w"
          if [ "$GOOS" = "windows" ]; then
            WFLAGS="$WFLAGS -H windowsgui"
          fi
          go build -o dist/${{ matrix.output }} -ldflags "$WFLAGS" ./cmd/minicipher/

      - name: Verify build
        run: ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: go-migrate/dist/${{ matrix.output }}

  release:
    runs-on: ubuntu-latest
    needs: build-all-platforms
    name: Create GitHub Release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Display release assets
        run: |
          echo "Release assets:"
          find release-assets -type f -exec ls -lh {} \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: miniCipher Go ${{ github.ref_name }}
          body: |
            ## miniCipher Go v${{ github.ref_name }}

            Go 实现的 miniCipher 加密工具，基于 Fyne GUI 框架。

            ### 下载说明

            | 平台 | 文件 |
            |------|------|
            | Linux (amd64) | `minicipher-linux-amd64` |
            | macOS (Apple Silicon) | `minicipher-macos-arm64` |
            | Windows (amd64) | `minicipher-windows-amd64.exe` |

            ### 功能

            - OTP / AES256-GCM 加密
            - 随机密钥 / 密码模式
            - 批量加密/解密（支持多线程）
            - 中英文界面
            - 深色/浅色主题

            ### 使用方式

            ```bash
            # Linux/macOS
            chmod +x minicipher-*
            ./minicipher-linux-amd64

            # Windows
            .\minicipher-windows-amd64.exe
            ```
          files: |
            release-assets/**/minicipher-*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}