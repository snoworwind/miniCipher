name: CI Build (Go)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goarch: amd64
            output: minicipher-linux-amd64
          - os: macos-latest
            goarch: arm64
            output: minicipher-macos-arm64
          - os: windows-latest
            goarch: amd64
            output: minicipher-windows-amd64.exe

    runs-on: ${{ matrix.os }}
    name: Build Go ${{ matrix.os }}-${{ matrix.goarch }}

    defaults:
      run:
        shell: bash
        working-directory: go-migrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go-migrate/go.sum

      - name: Display Go version
        run: |
          go version
          go env

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Download dependencies
        run: go mod download

      - name: Setup MinGW (Windows)
        if: runner.os == 'Windows'
        run: echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH

      - name: Build
        env:
          GOOS: ${{ matrix.os == 'windows-latest' && 'windows' || matrix.os == 'macos-latest' && 'darwin' || 'linux' }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          echo "Building for GOOS=${GOOS} GOARCH=${GOARCH}..."
          mkdir -p dist
          WFLAGS="-s -w"
          if [ "$GOOS" = "windows" ]; then
            WFLAGS="$WFLAGS -H windowsgui"
          fi
          go build -trimpath -o dist/${{ matrix.output }} -ldflags "$WFLAGS" ./cmd/minicipher/

      - name: Verify build
        run: |
          echo "Build artifacts:"
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: go-migrate/dist/${{ matrix.output }}
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    name: Go Test & Vet

    defaults:
      run:
        working-directory: go-migrate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: go-migrate/go.sum

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev

      - name: Verify go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "ERROR: go.mod or go.sum is not tidy. Run 'go mod tidy' locally."
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Lint (golangci-lint)
        run: golangci-lint run --timeout=5m ./...

  summary:
    runs-on: ubuntu-latest
    needs: [build, test]
    name: Build Summary
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display build summary
        run: |
          echo "============================"
          echo "     GO BUILD SUMMARY"
          echo "============================"
          echo ""
          if [ -d "artifacts" ]; then
            find artifacts -type f | while read file; do
              size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "unknown")
              echo "  - $(basename "$file") ($size bytes)"
            done
            echo ""
            echo "Artifacts available for download from GitHub Actions."
          else
            echo "No artifacts found."
          fi
          echo ""
          echo "============================"