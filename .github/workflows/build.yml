name: CI Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ['3.9', '3.10', '3.11']
        exclude:
          - os: windows-latest
            python-version: '3.9'  # Test only latest Python version on Windows
          - os: ubuntu-latest
            python-version: '3.9'  # Test only latest Python version on Linux
        include:
          # Main build configuration - one build per platform
          - os: windows-latest
            python-version: '3.11'
            platform: windows
            architecture: x64
            output_name: Cipher-windows-x64.exe
          - os: ubuntu-latest
            python-version: '3.11'
            platform: linux
            architecture: x64
            output_name: Cipher-linux-x64

    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.platform }}-${{ matrix.architecture }} (Python ${{ matrix.python-version }})

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Generate version information
      id: version
      run: |
        # Generate version information
        echo "VERSION_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_OUTPUT
        echo "RUN_NUMBER=${{ github.run_number }}" >> $GITHUB_OUTPUT
        
        # Create version file
        echo "version: v1.0.0+${{ github.run_id }}-$(git rev-parse --short HEAD)" > version.txt
        echo "build_date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> version.txt
        echo "commit: $(git rev-parse HEAD)" >> version.txt
        echo "platform: ${{ matrix.platform }}-${{ matrix.architecture }}" >> version.txt

    - name: Display Python version
      run: |
        python --version
        pip --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python build.py --install-deps --system-python

    - name: Build executable
      run: |
        echo "Building on ${{ matrix.platform }} ${{ matrix.architecture }}..."
        python build.py --clean --build --system-python
        
        # Verify build result
        if [ "${{ matrix.platform }}" = "windows" ]; then
          if [ -f "dist/Cipher.exe" ]; then
            echo "Build successful: dist/Cipher.exe"
            ls -la dist/
          else
            echo "ERROR: Cipher.exe not found!"
            ls -la dist/ || true
            exit 1
          fi
        else
          if [ -f "dist/Cipher" ]; then
            echo "Build successful: dist/Cipher"
            ls -la dist/
          else
            echo "ERROR: Cipher binary not found!"
            ls -la dist/ || true
            exit 1
          fi
        fi

    - name: Test build
      run: |
        echo "Testing build..."
        python build.py --test --system-python

    - name: Rename and prepare artifact
      run: |
        echo "Preparing artifact: ${{ matrix.output_name }}"
        
        if [ "${{ matrix.platform }}" = "windows" ]; then
          # Windows: rename exe file
          cp dist/Cipher.exe dist/${{ matrix.output_name }}
          echo "Artifact prepared: ${{ matrix.output_name }}"
        else
          # Linux: rename and ensure executable permissions
          cp dist/Cipher dist/${{ matrix.output_name }}
          chmod +x dist/${{ matrix.output_name }}
          echo "Artifact prepared: ${{ matrix.output_name }}"
        fi
        
        # Copy version file
        cp version.txt dist/version-${{ matrix.platform }}-${{ matrix.architecture }}.txt
        
        # Display build results
        echo "Build artifacts:"
        ls -la dist/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cipher-${{ matrix.platform }}-${{ matrix.architecture }}
        path: |
          dist/${{ matrix.output_name }}
          dist/version-${{ matrix.platform }}-${{ matrix.architecture }}.txt
        retention-days: 30

  test:
    runs-on: ubuntu-latest
    needs: build
    name: Run unit tests

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        python test_cipher.py -v

  summary:
    runs-on: ubuntu-latest
    needs: [build, test]
    name: Build Summary
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display build summary
      run: |
        echo "============================"
        echo "     BUILD SUMMARY"
        echo "============================"
        echo ""
        echo "Build completed for:"
        echo ""
        
        
        if [ -d "artifacts" ]; then
          find artifacts -name "*.exe" -o -name "Cipher-*" | while read file; do
            size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "unknown")
            echo "  - $(basename "$file") ($size bytes)"
          done
          
          echo ""
          echo "Artifacts available for download from GitHub Actions."
        else
          echo "No artifacts found."
        fi
        
        echo ""
        echo "============================"