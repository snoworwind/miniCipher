name: CI Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows configuration
          - os: windows-latest
            python-version: '3.11'
            platform: windows
            architecture: x64
            output_name: Cipher-windows-x64.exe
          # macOS configuration (Intel)
          - os: macos-latest
            python-version: '3.11'
            platform: macos
            architecture: x64
            output_name: Cipher-macos-x64
          # macOS configuration (Apple Silicon)
          - os: macos-latest
            python-version: '3.11'
            platform: macos
            architecture: arm64
            output_name: Cipher-macos-arm64
          # Linux configuration
          - os: ubuntu-latest
            python-version: '3.11'
            platform: linux
            architecture: x64
            output_name: Cipher-linux-x64

    env:
      PYTHONIOENCODING: utf-8
      TARGET_ARCH: ${{ matrix.architecture }}

    runs-on: ${{ matrix.os }}
    name: Build on ${{ matrix.platform }}-${{ matrix.architecture }} (Python ${{ matrix.python-version }})

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Generate version information
      id: version
      shell: bash
      run: |
        # Use version.py script to generate version information
        python version.py --type dev --platform ${{ matrix.platform }} --architecture ${{ matrix.architecture }}
        
        # Extract version from version.txt for GitHub Actions outputs
        VERSION=$(grep '^version:' version.txt | cut -d' ' -f2)
        COMMIT_HASH=$(grep '^commit_hash:' version.txt | cut -d' ' -f2)
        
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_OUTPUT
        echo "RUN_ID=${{ github.run_id }}" >> $GITHUB_OUTPUT
        echo "RUN_NUMBER=${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Display Python version
      run: |
        python --version
        pip --version

    - name: Install system dependencies
      shell: bash
      run: |
        echo "Installing system dependencies for ${{ matrix.platform }}..."
        
        case "${{ matrix.platform }}" in
          macos)
            echo "Installing tkinter for macOS..."
            # Check if tkinter is already available
            python -c "import tkinter" 2>/dev/null || brew install python-tk || echo "Warning: tkinter installation may have failed, continuing..."
            ;;
          linux)
            echo "Installing tkinter for Linux..."
            sudo apt-get update
            sudo apt-get install -y python3-tk || echo "Warning: tkinter installation may have failed, continuing..."
            ;;
          windows)
            echo "Windows: tkinter is typically included with Python installation"
            ;;
        esac
        
        echo "System dependencies installation completed."

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python build.py --install-deps --system-python

    - name: Build executable
      shell: bash
      run: |
        echo "Building on ${{ matrix.platform }} ${{ matrix.architecture }}..."
        python build.py --clean --build --system-python --target-arch ${{ matrix.architecture }}
        
        # Verify build result based on platform
        echo "Verifying build for ${{ matrix.platform }}..."
        case "${{ matrix.platform }}" in
          windows)
            if [ -f "dist/Cipher.exe" ]; then
              echo "Build successful: dist/Cipher.exe"
              ls -la dist/
            else
              echo "ERROR: Cipher.exe not found!"
              ls -la dist/ || true
              exit 1
            fi
            ;;
          macos|linux)
            if [ -f "dist/Cipher" ]; then
              echo "Build successful: dist/Cipher"
              ls -la dist/
            else
              echo "ERROR: Cipher not found!"
              ls -la dist/ || true
              exit 1
            fi
            ;;
        esac

    - name: Test build
      run: |
        echo "Testing build..."
        python build.py --test --system-python

    - name: Rename and prepare artifact
      shell: bash
      run: |
        echo "Preparing artifact: ${{ matrix.output_name }}"
        
        # Copy executable based on platform
        case "${{ matrix.platform }}" in
          windows)
            echo "Copying Windows executable..."
            cp dist/Cipher.exe dist/${{ matrix.output_name }}
            ;;
          macos|linux)
            echo "Copying macOS/Linux executable..."
            cp dist/Cipher dist/${{ matrix.output_name }}
            ;;
        esac
        
        echo "Artifact prepared: ${{ matrix.output_name }}"
        
        # Copy version file
        cp version.txt dist/version-${{ matrix.platform }}-${{ matrix.architecture }}.txt
        
        # Display build results
        echo "Build artifacts:"
        ls -la dist/

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cipher-${{ matrix.platform }}-${{ matrix.architecture }}
        path: |
          dist/${{ matrix.output_name }}
          dist/version-${{ matrix.platform }}-${{ matrix.architecture }}.txt
        retention-days: 30

  test:
    env:
      PYTHONIOENCODING: utf-8

    runs-on: ubuntu-latest
    needs: build
    name: Run unit tests

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python build.py --install-deps --system-python

    - name: Run unit tests
      run: |
        python test_cipher.py -v

  summary:
    runs-on: ubuntu-latest
    needs: [build, test]
    name: Build Summary
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display build summary
      shell: bash
      run: |
        echo "============================"
        echo "     BUILD SUMMARY"
        echo "============================"
        echo ""
        echo "Build completed for:"
        echo ""
        
        
        if [ -d "artifacts" ]; then
          find artifacts \( -name "*.exe" -o -name "Cipher-*" \) | while read file; do
            size=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file" 2>/dev/null || echo "unknown")
            echo "  - $(basename "$file") ($size bytes)"
          done
          
          echo ""
          echo "Artifacts available for download from GitHub Actions."
        else
          echo "No artifacts found."
        fi
        
        echo ""
        echo "============================"